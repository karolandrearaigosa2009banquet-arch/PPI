name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mi-proyecto/package-lock.json

      - name: Instalar dependencias
        working-directory: mi-proyecto
        run: npm ci

      - name: Verificar que los secretos llegaron al workflow
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "Secretos presentes (los valores no se imprimen)."

      - name: Compilar (npm run build)
        working-directory: mi-proyecto
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Comprobar el resultado del build
        working-directory: mi-proyecto
        run: |
          grep -rlq "supabase.co" dist/assets && echo "OK: el bundle trae la URL de Supabase"
          test -f dist/404.html && echo "OK: dist/404.html existe"
          grep -o 'src="[^"]*"' dist/index.html | head -3
          ls -la dist dist/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./mi-proyecto/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
